#################################################################
#  picom - VoidBR XFCE                                           #
#  Blur, sombras, cantos arredondados e fade                     #
#  O compositor do xfwm4 precisa estar DESLIGADO                 #
#  (xfwm4 -> use_compositing = false)                            #
#################################################################

################################# Backend #######################
# glx é necessário para o blur dual_kawase
backend = "glx";
vsync = true;

################################# Sombras #######################
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;

################################# Fade ##########################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;

################################# Cantos ########################
corner-radius = 10;

################################# Blur ##########################
# O blur aparece atrás de janelas/painéis translúcidos
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

################################# Detecção ######################
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

################################# Regras por janela #############
rules: (
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.95;
    full-shadow = false;
  },
  {
    match = "window_type = 'desktop'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
  },
  {
    match = "window_type = 'dock'";
    shadow = false;
    corner-radius = 0;
  },
  {
    match = "window_type = 'dropdown_menu' || "
            "window_type = 'popup_menu' || "
            "window_type = 'menu'";
    opacity = 0.95;
    corner-radius = 6;
  },
  {
    match = "fullscreen";
    corner-radius = 0;
  },
  {
    match = "class_g = 'cortile' || class_g = 'Cortile'";
    shadow = false;
    blur-background = false;
  }
)
