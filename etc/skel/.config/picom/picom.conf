#########################################
#        picom - VoidBR Linux XFCE      #
#   baseado na config do DESERT OS      #
#########################################
# Iniciado por /usr/bin/voidbr-picom:
#   - sem aceleração 3D (llvmpipe) usa o compositor do xfwm4
#   - com aceleração 3D (máquina real ou VM com virgl) sobe o picom
# O Plank fica fora do blur/sombra: a janela dele é transparente e
# bem maior que os ícones, e o blur viraria uma faixa borrada.

#################################
#            Corners            #
#################################
corner-radius = 25;

rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'"
];

#################################
#           Animations          #
#################################
fading = true;
fade-in-step = 0.01;
fade-out-step = 0.01;
fade-delta = 1;

fade-exclude = [
  "class_g = 'slop'"
];

animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.1;
  }
);

#################################
#            Shadow             #
#################################
shadow = true;
shadow-radius = 28;
shadow-offset-x = -28;
shadow-offset-y = -22;
shadow-opacity = 0.75;
clip-shadow-above = [];

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Xfwm4'",
  "class_g = 'Notify-osd'",
  "class_g = 'Xfce4-power-manager'",
  "class_g = 'Chromium'",
  "class_g = 'Zoom'",
  "class_g = 'cortile'",
  "class_g = 'Plank'",
  "_GTK_FRAME_EXTENTS@"
];

#################################
#             Opacity           #
#################################
active-opacity = 1.0;
inactive-opacity = 1.0;

#################################
#              Blur             #
#################################
blur: {
  method = "dual_kawase";
  strength = 10;
  background = true;
  background-frame = false;
  background-fixed = true;
  kern = "3x3box";
}

blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Xfce4-screenshooter'",
  "class_g = 'cortile'",
  "class_g = 'Plank'",
  "_GTK_FRAME_EXTENTS@"
];

#################################
#            Settings           #
#################################
vsync = true;
backend = "glx";
use-damage = true;
log-level = "warn";
